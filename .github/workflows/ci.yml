name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workout_ci
          POSTGRES_PASSWORD: workout_ci
          POSTGRES_DB: workout_bot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # FSM-тесты проверяют restart-safe состояние анкеты и без Redis
      # пропускаются, а не «проходят».
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Интеграционные тесты пропускаются без DATABASE_URL — в CI он задан,
      # поэтому PostgreSQL-тесты выполняются реально, а не молча скипаются.
      DATABASE_URL: postgresql+asyncpg://workout_ci:workout_ci@localhost:5432/workout_bot_ci
      REDIS_URL: redis://localhost:6379/0
      # Одноразовые значения только для CI: из них детерминированно выводится
      # Fernet-ключ шифрования AI-секретов. Это не production-секреты.
      JWT_SECRET: ci-only-jwt-secret-not-a-production-value
      AI_SECRETS_KEY: ci-only-ai-secrets-key-not-a-production-value

    steps:
      - uses: actions/checkout@v4

      # Каталог упражнений живёт во внешнем публичном репозитории. Без него
      # часть интеграционных тестов (программы, e2e, dashboard) проверяет
      # пустую базу и падает, поэтому каталог засевается реальными данными.
      - name: Checkout exercise catalog
        uses: actions/checkout@v4
        with:
          repository: leszavr/workout
          path: .exercise-catalog

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Assert migrations reached head
        run: alembic current | grep -q '(head)'

      - name: Import exercise catalog
        run: python -m scripts.import_exercises .exercise-catalog

      - name: Run tests
        run: pytest -q

  migrations:
    name: Database migrations (upgrade/downgrade)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workout_ci
          POSTGRES_PASSWORD: workout_ci
          POSTGRES_DB: workout_migrations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://workout_ci:workout_ci@localhost:5432/workout_migrations_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Single alembic head
        run: |
          heads=$(alembic heads | grep -c '(head)')
          test "$heads" -eq 1

      # Проверяются реальные миграции, а не фиктивный create_all:
      # чистая база → head → base → head.
      - name: Upgrade to head on a clean database
        run: alembic upgrade head

      - name: Downgrade to base
        run: alembic downgrade base

      - name: Upgrade to head again
        run: alembic upgrade head

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  report-failure:
    name: Report CI failure
    runs-on: ubuntu-latest
    needs: [backend, migrations, frontend]
    if: failure() && github.event_name == 'pull_request'
    permissions:
      issues: write

    steps:
      - name: Open an issue with the failing jobs
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              backend: '${{ needs.backend.result }}',
              migrations: '${{ needs.migrations.result }}',
              frontend: '${{ needs.frontend.result }}',
            };
            const failed = Object.entries(results)
              .filter(([, result]) => result === 'failure')
              .map(([job]) => job);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const title = `CI failure: ${failed.join(', ') || 'unknown'} (run ${context.runId})`;
            const body = [
              `CI упал на ветке \`${context.payload.pull_request.head.ref}\`.`,
              '',
              `- Pull Request: #${context.payload.pull_request.number}`,
              `- Commit: \`${context.payload.pull_request.head.sha}\``,
              `- Failing jobs: ${failed.map((j) => `\`${j}\``).join(', ') || 'unknown'}`,
              `- Логи: ${runUrl}`,
              '',
              'Полный вывод шага смотреть в логах запуска по ссылке выше.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure'],
            });
