services:
  telegram-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "apps.telegram_gateway.main"]
    # Переменные перечислены поимённо, а не через env_file: общий `.env` содержит
    # DATABASE_URL и ключи MinIO, а у шлюза доступа к хранилищам быть не должно.
    # Независимость проверяется фактически, а не по коду.
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set in .env}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      # Единственный канал к данным.
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
      TELEGRAM_COMPONENT_ID: ${TELEGRAM_COMPONENT_ID:-telegram-gateway-local-1}
      COMPONENT_REGION: ${TELEGRAM_REGION:-EU}
      BUILD_SHA: ${BUILD_SHA:-}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "apps.worker.main"]
    env_file:
      - ../.env
    environment:
      WORKOUT_DATA_DIR: /app/data
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workout_bot}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-workout_bot}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-workout-media}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      BUILD_SHA: ${BUILD_SHA:-}
    volumes:
      - bot-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    # Redis не нужен: очередь повторов и аренда живут в PostgreSQL.
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      WORKOUT_DATA_DIR: /app/data
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workout_bot}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-workout_bot}
      CORS_ORIGINS: http://localhost:3000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-workout-media}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:8000}
      BUILD_SHA: ${BUILD_SHA:-}
    volumes:
      - bot-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL — основное хранилище данных (users, profiles, consents, exercises).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workout_bot}
      POSTGRES_USER: ${POSTGRES_USER:-workout_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workout_bot} -d ${POSTGRES_DB:-workout_bot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Redis. Часть RU-инфраструктуры, оставленная на месте: после изоляции EU
  # Gateway ни один компонент к ней не обращается — FSM Gateway теперь в памяти
  # процесса, а очереди и аренда worker'а живут в PostgreSQL. Судьба контейнера
  # решается отдельной задачей: удаление RU-инфраструктуры в изоляцию Gateway не
  # входит. Подключать сюда шлюз нельзя — он в EU-сегменте.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # MinIO — object storage для медиа упражнений (S3-compatible).
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set in .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  bot-data:
  pg-data:
  redis-data:
  minio-data:
