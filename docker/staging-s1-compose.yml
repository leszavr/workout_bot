services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in staging.env}
      POSTGRES_USER: ${POSTGRES_USER:?set in staging.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in staging.env}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    cpus: 1.0
    mem_limit: 1536m
    mem_reservation: 512m
    pids_limit: 256
    restart: unless-stopped
    networks: [workout_net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1", "--save", "300", "10"]
    volumes:
      - staging-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 128
    restart: unless-stopped
    networks: [workout_net]

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in staging.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in staging.env}
    volumes:
      - staging-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    cpus: 0.75
    mem_limit: 1024m
    mem_reservation: 256m
    pids_limit: 256
    restart: unless-stopped
    networks: [workout_net]

networks:
  workout_net:
    external: true
    name: workout_net

volumes:
  staging-postgres-data:
    name: workout-staging-postgres-data
  staging-redis-data:
    name: workout-staging-redis-data
  staging-minio-data:
    name: workout-staging-minio-data
