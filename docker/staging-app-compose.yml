services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ${STAGING_APP_ENV_FILE:-/opt/workout_bot/compose/staging-app.env}
    environment:
      WORKOUT_DATA_DIR: /app/data
      # Размещение задаётся в compose, а не в env-файле: сервер и шлюз читают
      # один и тот же env-файл, а находятся в разных сегментах.
      COMPONENT_REGION: ${BACKEND_REGION:-RU}
      # Коммит сборки берётся из окружения команды деплоя, а не из env-файла:
      # он меняется при каждом деплое, и править файл вручную было бы источником
      # расхождения между образом и тем, что показывает /version.
      BUILD_SHA: ${BUILD_SHA:-}
    command: ["uvicorn", "apps.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - staging-bot-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 0.75
    mem_limit: 1024m
    mem_reservation: 256m
    pids_limit: 256
    restart: unless-stopped
    networks: [workout_net]

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?set in staging-app.env}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 768m
    mem_reservation: 256m
    pids_limit: 256
    restart: unless-stopped
    networks: [workout_net]

  telegram-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ${STAGING_APP_ENV_FILE:-/opt/workout_bot/compose/staging-app.env}
    environment:
      WORKOUT_DATA_DIR: /app/data
      # Шлюз размещается в EU-сегменте: это видно администратору в разделе
      # «Инфраструктура» и не влияет на маршрутизацию.
      COMPONENT_REGION: ${TELEGRAM_REGION:-EU}
      BUILD_SHA: ${BUILD_SHA:-}
    command: ["python", "-m", "apps.telegram_gateway.main"]
    volumes:
      - staging-bot-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 768m
    mem_reservation: 256m
    pids_limit: 256
    restart: unless-stopped
    networks:
      # Фиксированный адрес нужен хосту: только трафик этого контейнера
      # уходит в WireGuard-туннель до EU-узла (policy routing по source IP).
      # Остальные сервисы продолжают ходить через локального провайдера.
      workout_net:
        ipv4_address: ${TELEGRAM_BOT_IP:-172.18.0.20}

networks:
  workout_net:
    external: true
    name: workout_net

volumes:
  staging-bot-data:
    name: workout-staging-bot-data
