[project]
name = "workout-bot"
version = "2.0.0"
description = "Workout Bot: Telegram questionnaire gateway + FastAPI backend (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.13.1",
    "pydantic==2.9.2",
    "python-dotenv==1.0.1",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "cryptography>=42",
    "pillow>=10.2",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
